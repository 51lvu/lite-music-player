<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101010">
<title>Lite Music Player</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#101010;color:#eee;font-family:Arial,Helvetica,sans-serif;min-height:100%}
body{min-height:100vh}
.app{width:min(720px,100%);margin:0 auto;padding:16px 14px 190px}
h1{font-size:22px;margin:0 0 12px}
button,.btn{
  font:inherit;border:0;border-radius:8px;padding:10px 13px;background:#292929;color:#fff;
  text-decoration:none;display:inline-block;cursor:pointer
}
button:disabled{opacity:.45;cursor:default}
button:active:not(:disabled),.btn:active{transform:scale(.98)}
.primary{background:#1ed760;color:#08150b;font-weight:700}
.hidden{display:none!important}
.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.tabs{display:flex;gap:8px;margin:10px 0}
.tabs button.active{background:#eee;color:#111;font-weight:700}
.row{display:flex;gap:8px}
input[type=search]{
  flex:1;min-width:0;font-size:16px;padding:12px;background:#1d1d1d;color:#eee;
  border:1px solid #444;border-radius:8px;outline:none
}
#status{font-size:13px;color:#aaa;min-height:18px;margin:9px 0}
.item{
  width:100%;text-align:left;padding:12px 4px;border:0;border-bottom:1px solid #282828;
  background:transparent;border-radius:0
}
.itemTitle{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.itemSub{display:block;color:#999;font-size:13px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.playlistActions{display:flex;gap:8px;margin:8px 0 12px;flex-wrap:wrap}
.small{font-size:12px;color:#888;line-height:1.4}
.back{margin-bottom:8px}
.sectionTitle{font-size:16px;font-weight:700;margin:12px 0 4px}
.playerShell{
  position:fixed;left:0;right:0;bottom:0;background:#171717;border-top:1px solid #333;z-index:20
}
.playerInner{width:min(720px,100%);margin:0 auto;padding:9px 14px 12px}
#nowPlaying{font-size:13px;color:#ddd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:7px}
.controls{display:flex;justify-content:center;gap:9px;margin-bottom:6px}
.controls button{min-width:56px;padding:8px 10px}
.seekRow{display:flex;align-items:center;gap:8px}
.seekTime{font-size:11px;color:#999;min-width:35px}
input[type=range]{flex:1;min-width:0}
#deviceInfo{font-size:11px;color:#777;margin-top:5px;text-align:center}
.notice{padding:10px;border:1px solid #333;border-radius:8px;background:#181818;margin:10px 0}
</style>
</head>
<body>
<main class="app">
  <h1>Lite Music Player</h1>

  <div class="top">
    <a id="loginLink" class="btn primary hidden" target="_self">Log in to Spotify</a>
    <button id="logoutBtn" class="hidden">Log out</button>
    <button id="enableBtn" class="primary hidden">Enable Player</button>
  </div>

  <div id="tabs" class="tabs hidden">
    <button id="searchTab" class="active">Search</button>
    <button id="playlistsTab">Playlists</button>
  </div>

  <div id="notice" class="notice small hidden">
    After login, tap <b>Enable Player</b> once. This unlocks audio in Chrome and makes this browser your Spotify playback device.
  </div>

  <section id="searchView">
    <div class="row">
      <input id="searchBox" type="search" placeholder="Search songs or artists" autocomplete="off">
      <button id="searchBtn">Search</button>
    </div>
    <div id="searchResults"></div>
  </section>

  <section id="playlistsView" class="hidden">
    <button id="playlistBack" class="back hidden">← Playlists</button>
    <div id="playlistHeading" class="sectionTitle">Your playlists</div>
    <div id="playlistActions" class="playlistActions hidden"></div>
    <div id="playlistResults"></div>
  </section>

  <div id="status">Preparing login…</div>
</main>

<section class="playerShell hidden" id="playerShell">
  <div class="playerInner">
    <div id="nowPlaying">Nothing playing</div>
    <div class="controls">
      <button id="prevBtn" disabled>◀</button>
      <button id="playPauseBtn" disabled>▶</button>
      <button id="nextBtn" disabled>▶|</button>
    </div>
    <div class="seekRow">
      <span id="currentTime" class="seekTime">0:00</span>
      <input id="seek" type="range" min="0" max="1" value="0" step="1000" disabled>
      <span id="duration" class="seekTime">0:00</span>
    </div>
    <div id="deviceInfo">Player not enabled</div>
  </div>
</section>

<script>
const CLIENT_ID = "7f73efc8bfe14199b7d4e7890002b987";
const REDIRECT_URI = location.origin + location.pathname;
const AUTH_VERSION = "6";

const SCOPES = [
  "streaming",
  "user-read-email",
  "user-read-private",
  "user-read-playback-state",
  "user-modify-playback-state",
  "playlist-read-private",
  "playlist-read-collaborative"
].join(" ");

const $ = id => document.getElementById(id);
const loginLink = $("loginLink");
const logoutBtn = $("logoutBtn");
const enableBtn = $("enableBtn");
const tabs = $("tabs");
const notice = $("notice");
const searchTab = $("searchTab");
const playlistsTab = $("playlistsTab");
const searchView = $("searchView");
const playlistsView = $("playlistsView");
const searchBox = $("searchBox");
const searchBtn = $("searchBtn");
const searchResults = $("searchResults");
const playlistResults = $("playlistResults");
const playlistBack = $("playlistBack");
const playlistHeading = $("playlistHeading");
const playlistActions = $("playlistActions");
const statusEl = $("status");
const playerShell = $("playerShell");
const nowPlaying = $("nowPlaying");
const prevBtn = $("prevBtn");
const playPauseBtn = $("playPauseBtn");
const nextBtn = $("nextBtn");
const seek = $("seek");
const currentTime = $("currentTime");
const durationEl = $("duration");
const deviceInfo = $("deviceInfo");

let sdkReady = false;
let player = null;
let deviceId = null;
let playerEnabled = false;
let lastState = null;
let isSeeking = false;
let playlistsLoaded = false;
let currentPlaylist = null;
let progressTimer = null;

function status(msg){ statusEl.textContent = msg; }

function randomString(n=64){
  const chars="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~";
  const bytes=new Uint8Array(n);
  crypto.getRandomValues(bytes);
  return Array.from(bytes,b=>chars[b%chars.length]).join("");
}

function base64url(buf){
  let s="";
  const a=new Uint8Array(buf);
  for(let i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);
  return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}

async function sha256(s){
  return crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));
}

function clearAuth(){
  [
    "access_token","refresh_token","expires_at","pkce_verifier",
    "oauth_state","auth_version"
  ].forEach(k=>localStorage.removeItem(k));
}

async function prepareLoginLink(){
  const verifier=randomString();
  const state=randomString(24);
  const challenge=base64url(await sha256(verifier));

  localStorage.setItem("pkce_verifier",verifier);
  localStorage.setItem("oauth_state",state);
  localStorage.setItem("auth_version",AUTH_VERSION);

  const p=new URLSearchParams({
    client_id:CLIENT_ID,
    response_type:"code",
    redirect_uri:REDIRECT_URI,
    scope:SCOPES,
    code_challenge_method:"S256",
    code_challenge:challenge,
    state
  });

  loginLink.href="https://accounts.spotify.com/authorize?"+p.toString();
  loginLink.target="_self";
  loginLink.classList.remove("hidden");
  status("Not logged in.");
}

function saveTokens(d){
  if(d.access_token)localStorage.setItem("access_token",d.access_token);
  if(d.refresh_token)localStorage.setItem("refresh_token",d.refresh_token);
  if(d.expires_in)localStorage.setItem("expires_at",String(Date.now()+d.expires_in*1000-60000));
  localStorage.setItem("auth_version",AUTH_VERSION);
}

async function exchangeCode(code){
  const verifier=localStorage.getItem("pkce_verifier");
  if(!verifier)throw new Error("Login session was lost. Tap Log in again.");

  const body=new URLSearchParams({
    client_id:CLIENT_ID,
    grant_type:"authorization_code",
    code,
    redirect_uri:REDIRECT_URI,
    code_verifier:verifier
  });

  const r=await fetch("https://accounts.spotify.com/api/token",{
    method:"POST",
    headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body
  });

  const d=await r.json();
  if(!r.ok)throw new Error(d.error_description||d.error||"Spotify login failed.");

  saveTokens(d);
  localStorage.removeItem("pkce_verifier");
  localStorage.removeItem("oauth_state");
  history.replaceState({},"",REDIRECT_URI);
}

async function refreshToken(){
  const rt=localStorage.getItem("refresh_token");
  if(!rt)return null;

  const body=new URLSearchParams({
    client_id:CLIENT_ID,
    grant_type:"refresh_token",
    refresh_token:rt
  });

  const r=await fetch("https://accounts.spotify.com/api/token",{
    method:"POST",
    headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body
  });

  const d=await r.json();
  if(!r.ok){
    clearAuth();
    throw new Error("Spotify login expired. Log in again.");
  }

  saveTokens(d);
  return d.access_token;
}

async function getToken(){
  if(localStorage.getItem("auth_version")!==AUTH_VERSION)return null;

  const t=localStorage.getItem("access_token");
  const exp=Number(localStorage.getItem("expires_at")||0);

  if(t && Date.now()<exp)return t;
  return refreshToken();
}

async function apiFetch(url,options={}){
  let t=await getToken();
  if(!t)throw new Error("Please log in.");

  options.headers=Object.assign({},options.headers||{},{
    Authorization:"Bearer "+t
  });

  let r=await fetch(url,options);

  if(r.status===401){
    t=await refreshToken();
    options.headers.Authorization="Bearer "+t;
    r=await fetch(url,options);
  }

  return r;
}

function setLoggedIn(on){
  loginLink.classList.toggle("hidden",on);
  logoutBtn.classList.toggle("hidden",!on);
  enableBtn.classList.toggle("hidden",!on);
  tabs.classList.toggle("hidden",!on);
  notice.classList.toggle("hidden",!on);
}

function fmt(ms){
  ms=Math.max(0,Number(ms)||0);
  const total=Math.floor(ms/1000);
  return Math.floor(total/60)+":"+String(total%60).padStart(2,"0");
}

function sleep(ms){
  return new Promise(resolve=>setTimeout(resolve,ms));
}

async function getPlaybackState(){
  const r=await apiFetch("https://api.spotify.com/v1/me/player");
  if(r.status===204)return null;
  const d=await r.json().catch(()=>null);
  if(!r.ok){
    const msg=d && d.error && d.error.message ? d.error.message : "Could not read playback state";
    throw new Error(msg);
  }
  return d;
}

async function ensureChromeDevice(){
  if(!deviceId)throw new Error("Chrome player is not ready.");

  let state=null;
  try{ state=await getPlaybackState(); }catch(e){}

  if(!state || !state.device || state.device.id!==deviceId){
    const r=await apiFetch("https://api.spotify.com/v1/me/player",{
      method:"PUT",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({device_ids:[deviceId],play:false})
    });

    if(!r.ok && r.status!==204){
      const d=await r.json().catch(()=>({}));
      throw new Error(d.error && d.error.message ? d.error.message : "Could not activate Chrome player");
    }

    // Spotify notes ordering across Player API endpoints is not guaranteed;
    // give Connect a brief moment to finish the transfer before play/seek.
    await sleep(450);
  }
}

async function setShuffleOff(){
  if(!deviceId)return;
  const r=await apiFetch(
    "https://api.spotify.com/v1/me/player/shuffle?state=false&device_id="+encodeURIComponent(deviceId),
    {method:"PUT"}
  );
  if(!r.ok && r.status!==204){
    const d=await r.json().catch(()=>({}));
    throw new Error(d.error && d.error.message ? d.error.message : "Could not disable shuffle");
  }
}

async function setRepeatOff(){
  if(!deviceId)return;
  const r=await apiFetch(
    "https://api.spotify.com/v1/me/player/repeat?state=off&device_id="+encodeURIComponent(deviceId),
    {method:"PUT"}
  );
  if(!r.ok && r.status!==204){
    const d=await r.json().catch(()=>({}));
    throw new Error(d.error && d.error.message ? d.error.message : "Could not disable repeat");
  }
}

function setControlsEnabled(on){
  prevBtn.disabled=!on;
  playPauseBtn.disabled=!on;
  nextBtn.disabled=!on;
  seek.disabled=!on || !lastState;
}

function updateState(state){
  if(!state)return;
  lastState=state;

  const track=state.track_window && state.track_window.current_track;
  if(track){
    const artists=(track.artists||[]).map(a=>a.name).join(", ");
    nowPlaying.textContent=track.name+(artists?" — "+artists:"");
  }

  playPauseBtn.textContent=state.paused?"▶":"❚❚";

  if(!isSeeking){
    seek.max=String(Math.max(1,state.duration||1));
    seek.value=String(Math.min(state.position||0,state.duration||1));
    currentTime.textContent=fmt(state.position);
    durationEl.textContent=fmt(state.duration);
  }

  setControlsEnabled(playerEnabled);
}

function startProgressTimer(){
  if(progressTimer)clearInterval(progressTimer);
  progressTimer=setInterval(async()=>{
    if(!player || !playerEnabled || isSeeking)return;
    try{
      const s=await player.getCurrentState();
      if(s)updateState(s);
    }catch(e){}
  },1000);
}

async function createPlayerIfPossible(){
  if(player || !sdkReady)return;

  const token=await getToken();
  if(!token)return;

  player=new Spotify.Player({
    name:"Lite Music Player",
    volume:0.85,
    getOAuthToken:cb=>{
      getToken()
        .then(t=>t ? cb(t) : Promise.reject(new Error("No Spotify token")))
        .catch(e=>status("Token error: "+e.message));
    }
  });

  player.addListener("ready",({device_id})=>{
    deviceId=device_id;
    playerShell.classList.remove("hidden");
    deviceInfo.textContent="Chrome player ready";
    status("Player connected. Tap Enable Player once.");
  });

  player.addListener("not_ready",()=>{
    deviceId=null;
    playerEnabled=false;
    setControlsEnabled(false);
    deviceInfo.textContent="Player offline";
    status("Spotify player went offline.");
  });

  player.addListener("player_state_changed",state=>{
    if(state)updateState(state);
  });

  player.addListener("initialization_error",({message})=>status("Initialization error: "+message));
  player.addListener("authentication_error",({message})=>status("Authentication error: "+message));
  player.addListener("account_error",({message})=>status("Account error: "+message));
  player.addListener("playback_error",({message})=>status("Playback error: "+message));
  player.addListener("autoplay_failed",()=>{
    playerEnabled=false;
    enableBtn.classList.remove("hidden");
    setControlsEnabled(false);
    status("Chrome blocked audio. Tap Enable Player again.");
  });

  const connected=await player.connect();
  if(!connected)status("Could not connect the Spotify player.");
}

window.onSpotifyWebPlaybackSDKReady=()=>{
  sdkReady=true;
  createPlayerIfPossible().catch(e=>status("Player setup error: "+e.message));
};

async function enablePlayer(){
  if(!player){
    status("Player is still loading. Try again in a moment.");
    return;
  }
  if(!deviceId){
    status("Waiting for Spotify device…");
    return;
  }

  try{
    // Must be called from this physical tap on mobile Chrome.
    await player.activateElement();

    const r=await apiFetch("https://api.spotify.com/v1/me/player",{
      method:"PUT",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({device_ids:[deviceId],play:false})
    });

    if(!r.ok && r.status!==204){
      const d=await r.json().catch(()=>({}));
      throw new Error(d.error && d.error.message ? d.error.message : "Could not activate browser device");
    }

    await sleep(500);

    // Keep this lightweight player deterministic.
    try{
      await setShuffleOff();
      await sleep(250);
      await setRepeatOff();
    }catch(e){
      // Playback can still work if these state calls fail.
    }

    playerEnabled=true;
    enableBtn.classList.add("hidden");
    notice.classList.add("hidden");
    setControlsEnabled(true);
    deviceInfo.textContent="Chrome player enabled";
    status("Player enabled. Choose a song.");
    startProgressTimer();
  }catch(e){
    status("Enable error: "+e.message);
  }
}

async function playUris(uris,positionMs=0){
  if(!playerEnabled || !deviceId){
    status("Tap Enable Player first.");
    return;
  }
  if(!uris || !uris.length)throw new Error("No track URI.");

  const requestedUri=uris[0];

  await ensureChromeDevice();

  // One explicit URI = exact selected track, no playlist/context involved.
  const sendPlay=async()=>{
    const r=await apiFetch(
      "https://api.spotify.com/v1/me/player/play?device_id="+encodeURIComponent(deviceId),
      {
        method:"PUT",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({uris:[requestedUri],position_ms:Math.max(0,Math.floor(positionMs))})
      }
    );

    if(!r.ok && r.status!==204){
      const d=await r.json().catch(()=>({}));
      throw new Error(d.error && d.error.message ? d.error.message : "Playback failed");
    }
  };

  await sendPlay();

  // Verify Spotify Connect actually switched to the requested URI.
  // Old/mobile browser sessions can briefly retain stale playback state.
  for(let attempt=0;attempt<4;attempt++){
    await sleep(attempt===0 ? 700 : 450);
    let state=null;
    try{ state=await getPlaybackState(); }catch(e){}

    const actual=state && state.item && state.item.uri;
    if(actual===requestedUri){
      return;
    }

    if(attempt===1){
      // Reassert the browser device once if the old Connect device won the race.
      await ensureChromeDevice();
    }

    await sendPlay();
  }

  throw new Error("Spotify did not switch to the selected track. Tap it once more.");
}

async function playContext(contextUri,offsetUri=null){
  if(!playerEnabled || !deviceId){
    status("Tap Enable Player first.");
    return;
  }

  const body={context_uri:contextUri,position_ms:0};
  if(offsetUri)body.offset={uri:offsetUri};

  const r=await apiFetch(
    "https://api.spotify.com/v1/me/player/play?device_id="+encodeURIComponent(deviceId),
    {
      method:"PUT",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(body)
    }
  );

  if(!r.ok && r.status!==204){
    const d=await r.json().catch(()=>({}));
    throw new Error(d.error && d.error.message ? d.error.message : "Playback failed");
  }
}

function renderTracks(tracks,target,playlistUri=null){
  target.innerHTML="";
  if(!tracks.length){
    target.textContent="No tracks found.";
    return;
  }

  const frag=document.createDocumentFragment();

  tracks.forEach(track=>{
    if(!track || track.type!=="track")return;

    const b=document.createElement("button");
    b.className="item";

    const title=document.createElement("span");
    title.className="itemTitle";
    title.textContent=track.name||"Unknown track";

    const artist=document.createElement("span");
    artist.className="itemSub";
    artist.textContent=(track.artists||[]).map(a=>a.name).join(", ");

    b.append(title,artist);

    b.addEventListener("click",async()=>{
      try{
        status("Starting "+track.name+"…");
        if(playlistUri){
          await playContext(playlistUri,track.uri);
        }else{
          await playUris([track.uri],0);
        }
        status("Playing.");
      }catch(e){
        status("Play error: "+e.message);
      }
    });

    frag.appendChild(b);
  });

  target.appendChild(frag);
}

async function doSearch(){
  const q=searchBox.value.trim();
  if(!q)return;

  try{
    status("Searching…");
    searchResults.innerHTML="";

    const r=await apiFetch(
      "https://api.spotify.com/v1/search?type=track&limit=10&q="+encodeURIComponent(q)
    );
    const d=await r.json();

    if(!r.ok)throw new Error(d.error && d.error.message ? d.error.message : "Search failed");

    renderTracks((d.tracks && d.tracks.items)||[],searchResults,null);
    status("Tap a song.");
  }catch(e){
    status("Search error: "+e.message);
  }
}

async function loadPlaylists(){
  playlistsLoaded=true;
  currentPlaylist=null;
  playlistHeading.textContent="Your playlists";
  playlistBack.classList.add("hidden");
  playlistActions.classList.add("hidden");
  playlistActions.innerHTML="";
  playlistResults.innerHTML="";
  status("Loading playlists…");

  try{
    const r=await apiFetch("https://api.spotify.com/v1/me/playlists?limit=50");
    const d=await r.json();

    if(!r.ok)throw new Error(d.error && d.error.message ? d.error.message : "Could not load playlists");

    const items=d.items||[];

    if(!items.length){
      playlistResults.textContent="No playlists found.";
      status("No playlists found.");
      return;
    }

    const frag=document.createDocumentFragment();

    items.forEach(pl=>{
      const b=document.createElement("button");
      b.className="item";

      const title=document.createElement("span");
      title.className="itemTitle";
      title.textContent=pl.name||"Playlist";

      const sub=document.createElement("span");
      sub.className="itemSub";
      const total=pl.items && pl.items.total!=null ? pl.items.total :
                  pl.tracks && pl.tracks.total!=null ? pl.tracks.total : null;
      sub.textContent=total!=null ? total+" items" : "Playlist";

      b.append(title,sub);
      b.addEventListener("click",()=>openPlaylist(pl));
      frag.appendChild(b);
    });

    playlistResults.appendChild(frag);
    status("Tap a playlist.");
  }catch(e){
    status("Playlist error: "+e.message);
  }
}

async function openPlaylist(pl){
  currentPlaylist=pl;
  playlistHeading.textContent=pl.name||"Playlist";
  playlistBack.classList.remove("hidden");
  playlistActions.classList.remove("hidden");
  playlistActions.innerHTML="";
  playlistResults.innerHTML="";

  const playBtn=document.createElement("button");
  playBtn.className="primary";
  playBtn.textContent="▶ Play playlist";
  playBtn.addEventListener("click",async()=>{
    try{
      status("Starting playlist…");
      await playContext(pl.uri);
      status("Playing playlist.");
    }catch(e){
      status("Play error: "+e.message);
    }
  });
  playlistActions.appendChild(playBtn);

  status("Loading playlist tracks…");

  try{
    const r=await apiFetch(
      "https://api.spotify.com/v1/playlists/"+encodeURIComponent(pl.id)+"/items?limit=50"
    );

    if(r.status===403){
      playlistResults.innerHTML='<div class="small">Spotify does not expose the track list of this followed playlist to this app, but you can still play the whole playlist with the button above.</div>';
      status("Playlist ready.");
      return;
    }

    const d=await r.json();
    if(!r.ok)throw new Error(d.error && d.error.message ? d.error.message : "Could not load playlist");

    const tracks=(d.items||[])
      .map(x=>x && (x.item || x.track))
      .filter(x=>x && x.type==="track");

    renderTracks(tracks,playlistResults,pl.uri);
    status("Tap a track or play the whole playlist.");
  }catch(e){
    status("Playlist error: "+e.message);
  }
}

function showSearch(){
  searchTab.classList.add("active");
  playlistsTab.classList.remove("active");
  searchView.classList.remove("hidden");
  playlistsView.classList.add("hidden");
}

function showPlaylists(){
  playlistsTab.classList.add("active");
  searchTab.classList.remove("active");
  playlistsView.classList.remove("hidden");
  searchView.classList.add("hidden");
  if(!playlistsLoaded)loadPlaylists();
}

enableBtn.addEventListener("click",enablePlayer);

searchBtn.addEventListener("click",doSearch);
searchBox.addEventListener("keydown",e=>{
  if(e.key==="Enter")doSearch();
});

searchTab.addEventListener("click",showSearch);
playlistsTab.addEventListener("click",showPlaylists);
playlistBack.addEventListener("click",loadPlaylists);

playPauseBtn.addEventListener("click",async()=>{
  if(!playerEnabled || !deviceId)return;
  try{
    await ensureChromeDevice();
    const s=await getPlaybackState();

    if(s && s.is_playing){
      const r=await apiFetch(
        "https://api.spotify.com/v1/me/player/pause?device_id="+encodeURIComponent(deviceId),
        {method:"PUT"}
      );
      if(!r.ok && r.status!==204)throw new Error("Pause failed");
    }else{
      const r=await apiFetch(
        "https://api.spotify.com/v1/me/player/play?device_id="+encodeURIComponent(deviceId),
        {method:"PUT"}
      );
      if(!r.ok && r.status!==204)throw new Error("Resume failed");
    }
  }catch(e){ status("Playback error: "+e.message); }
});

prevBtn.addEventListener("click",async()=>{
  if(!playerEnabled || !deviceId)return;
  try{
    await ensureChromeDevice();
    const r=await apiFetch(
      "https://api.spotify.com/v1/me/player/previous?device_id="+encodeURIComponent(deviceId),
      {method:"POST"}
    );
    if(!r.ok && r.status!==204)throw new Error("Previous command failed");
  }catch(e){ status("Previous-track error: "+e.message); }
});

nextBtn.addEventListener("click",async()=>{
  if(!playerEnabled || !deviceId)return;
  try{
    await ensureChromeDevice();
    const r=await apiFetch(
      "https://api.spotify.com/v1/me/player/next?device_id="+encodeURIComponent(deviceId),
      {method:"POST"}
    );
    if(!r.ok && r.status!==204)throw new Error("Next command failed");
  }catch(e){ status("Next-track error: "+e.message); }
});

seek.addEventListener("input",()=>{
  isSeeking=true;
  currentTime.textContent=fmt(seek.value);
});

let lastSeekCommit=0;

async function commitSeek(){
  if(!playerEnabled || !deviceId){
    isSeeking=false;
    return;
  }

  const now=Date.now();
  if(now-lastSeekCommit<250)return;
  lastSeekCommit=now;

  const target=Math.max(0,Math.floor(Number(seek.value)||0));

  try{
    await ensureChromeDevice();

    const r=await apiFetch(
      "https://api.spotify.com/v1/me/player/seek?position_ms="+encodeURIComponent(target)+
      "&device_id="+encodeURIComponent(deviceId),
      {method:"PUT"}
    );

    if(!r.ok && r.status!==204){
      const d=await r.json().catch(()=>({}));
      throw new Error(d.error && d.error.message ? d.error.message : "Seek failed");
    }

    currentTime.textContent=fmt(target);
    status("Moved to "+fmt(target)+".");
    await sleep(300);

    // Pull fresh state instead of letting the old SDK position snap the bar back.
    try{
      const s=await player.getCurrentState();
      if(s)updateState(s);
    }catch(e){}
  }catch(e){
    status("Seek error: "+e.message);
  }finally{
    isSeeking=false;
  }
}

seek.addEventListener("change",commitSeek);
seek.addEventListener("pointerup",commitSeek);
seek.addEventListener("touchend",commitSeek,{passive:true});

logoutBtn.addEventListener("click",()=>{
  if(progressTimer)clearInterval(progressTimer);
  progressTimer=null;

  if(player){
    try{player.disconnect()}catch(e){}
  }

  player=null;
  deviceId=null;
  playerEnabled=false;
  lastState=null;
  playlistsLoaded=false;
  currentPlaylist=null;
  searchResults.innerHTML="";
  playlistResults.innerHTML="";
  playerShell.classList.add("hidden");

  clearAuth();
  setLoggedIn(false);
  prepareLoginLink().catch(e=>status(e.message));
});

(async function boot(){
  try{
    const p=new URLSearchParams(location.search);
    const err=p.get("error");
    const code=p.get("code");

    if(err)throw new Error("Spotify login: "+err);

    if(code){
      const expected=localStorage.getItem("oauth_state");
      if(expected && p.get("state")!==expected){
        throw new Error("Spotify login state check failed.");
      }

      status("Finishing Spotify login…");
      await exchangeCode(code);
    }else if(localStorage.getItem("auth_version")!==AUTH_VERSION){
      clearAuth();
    }

    const token=await getToken();

    if(token){
      setLoggedIn(true);
      playerShell.classList.remove("hidden");
      status("Logged in. Waiting for Spotify player…");
      createPlayerIfPossible().catch(e=>status("Player setup error: "+e.message));
    }else{
      setLoggedIn(false);
      await prepareLoginLink();
    }
  }catch(e){
    clearAuth();
    setLoggedIn(false);
    status(e.message);
    await prepareLoginLink();
  }
})();
</script>
