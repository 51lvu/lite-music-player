<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>Lite Music Player</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Arial,Helvetica,sans-serif;
      background:#111;
      color:#eee;
      min-height:100vh;
    }
    .app{
      width:min(680px,100%);
      margin:0 auto;
      padding:18px 14px 90px;
    }
    h1{font-size:22px;margin:0 0 14px}
    .row{display:flex;gap:8px}
    input{
      flex:1;
      min-width:0;
      font-size:16px;
      padding:12px;
      color:#eee;
      background:#1e1e1e;
      border:1px solid #444;
      border-radius:8px;
      outline:none;
    }
    button{
      font:inherit;
      padding:11px 14px;
      border:0;
      border-radius:8px;
      cursor:pointer;
      background:#2a2a2a;
      color:#fff;
    }
    button:active{transform:scale(.98)}
    .primary{background:#1ed760;color:#09140c;font-weight:700}
    .top-actions{display:flex;gap:8px;margin-bottom:12px}
    #status{
      font-size:13px;
      color:#aaa;
      min-height:18px;
      margin:10px 0;
    }
    #results{margin-top:8px}
    .track{
      width:100%;
      text-align:left;
      padding:12px 4px;
      border-bottom:1px solid #282828;
      background:transparent;
      border-radius:0;
    }
    .track-title{
      display:block;
      font-size:16px;
      color:#fff;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .track-artist{
      display:block;
      margin-top:3px;
      font-size:13px;
      color:#aaa;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .playerbar{
      position:fixed;
      bottom:0;
      left:0;
      right:0;
      background:#191919;
      border-top:1px solid #333;
    }
    .player-inner{
      width:min(680px,100%);
      margin:0 auto;
      padding:9px 14px 12px;
    }
    #nowPlaying{
      font-size:13px;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      color:#ddd;
      margin-bottom:8px;
    }
    .controls{
      display:flex;
      justify-content:center;
      gap:10px;
    }
    .controls button{
      min-width:62px;
      padding:9px 12px;
    }
    .hidden{display:none}
  </style>
</head>
<body>
  <main class="app">
    <h1>Lite Music Player</h1>

    <div class="top-actions">
      <button id="loginBtn" class="primary">Log in to Spotify</button>
      <button id="logoutBtn" class="hidden">Log out</button>
      <button id="enableAudioBtn" class="hidden">Enable Audio</button>
    </div>

    <div class="row">
      <input id="searchBox" type="search" placeholder="Search songs or artists" autocomplete="off">
      <button id="searchBtn">Search</button>
    </div>

    <div id="status">Not logged in.</div>
    <section id="results"></section>
  </main>

  <div class="playerbar">
    <div class="player-inner">
      <div id="nowPlaying">Nothing playing</div>
      <div class="controls">
        <button id="prevBtn">◀</button>
        <button id="playBtn">▶ / ❚❚</button>
        <button id="nextBtn">▶</button>
      </div>
    </div>
  </div>

  <script src="https://sdk.scdn.co/spotify-player.js"></script>
  <script>
    // Spotify Client ID. This is public by design when using PKCE.
    const CLIENT_ID = "7f73efc8bfe14199b7d4e7890002b987";

    // IMPORTANT:
    // Register the exact published URL of this page in Spotify Dashboard
    // as a Redirect URI. Example:
    // https://YOURNAME.github.io/lite-music-player/
    const REDIRECT_URI = location.origin + location.pathname;

    const SCOPES = [
      "streaming",
      "user-read-email",
      "user-read-private",
      "user-read-playback-state",
      "user-modify-playback-state"
    ].join(" ");

    const el = id => document.getElementById(id);
    const statusEl = el("status");
    const resultsEl = el("results");
    const loginBtn = el("loginBtn");
    const logoutBtn = el("logoutBtn");
    const enableAudioBtn = el("enableAudioBtn");
    const searchBtn = el("searchBtn");
    const searchBox = el("searchBox");
    const playBtn = el("playBtn");
    const prevBtn = el("prevBtn");
    const nextBtn = el("nextBtn");
    const nowPlaying = el("nowPlaying");

    let player = null;
    let deviceId = null;
    let sdkReady = false;
    let playerStarted = false;
    let audioUnlocked = false;

    function setStatus(msg){ statusEl.textContent = msg; }

    function randomString(length = 64){
      const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~";
      const bytes = new Uint8Array(length);
      crypto.getRandomValues(bytes);
      return Array.from(bytes, b => chars[b % chars.length]).join("");
    }

    function base64url(bytes){
      let str = "";
      const arr = new Uint8Array(bytes);
      for (let i = 0; i < arr.byteLength; i++) str += String.fromCharCode(arr[i]);
      return btoa(str).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
    }

    async function sha256(text){
      return crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
    }

    async function beginLogin(){
      try{
        const verifier = randomString(64);
        const challenge = base64url(await sha256(verifier));
        const state = randomString(24);

        localStorage.setItem("pkce_verifier", verifier);
        localStorage.setItem("oauth_state", state);

        const params = new URLSearchParams({
          client_id: CLIENT_ID,
          response_type: "code",
          redirect_uri: REDIRECT_URI,
          scope: SCOPES,
          code_challenge_method: "S256",
          code_challenge: challenge,
          state
        });

        window.open("https://accounts.spotify.com/authorize?" + params.toString(), "_self");
      }catch(err){
        setStatus("Login setup failed: " + err.message);
      }
    }

    function saveTokens(data){
      if (data.access_token) localStorage.setItem("access_token", data.access_token);
      if (data.refresh_token) localStorage.setItem("refresh_token", data.refresh_token);
      if (data.expires_in){
        localStorage.setItem("expires_at", String(Date.now() + (data.expires_in * 1000) - 60000));
      }
    }

    async function exchangeCode(code){
      const verifier = localStorage.getItem("pkce_verifier");
      if (!verifier) throw new Error("Missing PKCE verifier. Start login again.");

      const body = new URLSearchParams({
        client_id: CLIENT_ID,
        grant_type: "authorization_code",
        code,
        redirect_uri: REDIRECT_URI,
        code_verifier: verifier
      });

      const r = await fetch("https://accounts.spotify.com/api/token", {
        method: "POST",
        headers: {"Content-Type":"application/x-www-form-urlencoded"},
        body
      });

      const data = await r.json();
      if (!r.ok) throw new Error(data.error_description || data.error || "Token exchange failed");
      saveTokens(data);
      localStorage.removeItem("pkce_verifier");
      localStorage.removeItem("oauth_state");
      history.replaceState({}, "", REDIRECT_URI);
    }

    async function refreshAccessToken(){
      const refreshToken = localStorage.getItem("refresh_token");
      if (!refreshToken) return null;

      const body = new URLSearchParams({
        client_id: CLIENT_ID,
        grant_type: "refresh_token",
        refresh_token: refreshToken
      });

      const r = await fetch("https://accounts.spotify.com/api/token", {
        method:"POST",
        headers:{"Content-Type":"application/x-www-form-urlencoded"},
        body
      });

      const data = await r.json();
      if (!r.ok){
        clearAuth();
        throw new Error(data.error_description || data.error || "Token refresh failed");
      }
      saveTokens(data);
      return data.access_token;
    }

    async function getValidToken(){
      const token = localStorage.getItem("access_token");
      const expiresAt = Number(localStorage.getItem("expires_at") || 0);

      if (token && Date.now() < expiresAt) return token;
      if (localStorage.getItem("refresh_token")) return refreshAccessToken();
      return null;
    }

    function clearAuth(){
      localStorage.removeItem("access_token");
      localStorage.removeItem("refresh_token");
      localStorage.removeItem("expires_at");
      deviceId = null;
      if (player){
        try{ player.disconnect(); }catch(e){}
      }
      player = null;
      playerStarted = false;
      audioUnlocked = false;
      enableAudioBtn.classList.add("hidden");
      resultsEl.innerHTML = "";
      nowPlaying.textContent = "Nothing playing";
      updateAuthUI(false);
    }

    function updateAuthUI(loggedIn){
      loginBtn.classList.toggle("hidden", loggedIn);
      logoutBtn.classList.toggle("hidden", !loggedIn);
      if (!loggedIn) setStatus("Not logged in.");
    }

    window.onSpotifyWebPlaybackSDKReady = () => {
      sdkReady = true;
      startPlayerIfPossible();
    };

    async function startPlayerIfPossible(){
      if (playerStarted || !sdkReady) return;
      const token = await getValidToken();
      if (!token) return;

      playerStarted = true;
      updateAuthUI(true);
      setStatus("Connecting player…");

      player = new Spotify.Player({
        name: "Lite Music Player",
        volume: 0.8,
        getOAuthToken: cb => {
          getValidToken()
            .then(t => t ? cb(t) : Promise.reject(new Error("No token")))
            .catch(err => setStatus("Token error: " + err.message));
        }
      });

      player.addListener("ready", ({device_id}) => {
        deviceId = device_id;
        enableAudioBtn.classList.remove("hidden");
        setStatus("Ready. Tap Enable Audio once, then search for a song.");
      });

      player.addListener("not_ready", () => {
        deviceId = null;
        setStatus("Player temporarily unavailable.");
      });

      player.addListener("initialization_error", ({message}) => setStatus("Player error: " + message));
      player.addListener("authentication_error", ({message}) => setStatus("Login error: " + message));
      player.addListener("account_error", ({message}) => setStatus("Account error: " + message));
      player.addListener("playback_error", ({message}) => setStatus("Playback error: " + message));
      player.addListener("autoplay_failed", () => {
        audioUnlocked = false;
        enableAudioBtn.classList.remove("hidden");
        setStatus("Via blocked autoplay. Tap Enable Audio, then tap the song again.");
      });

      player.addListener("player_state_changed", state => {
        if (!state) return;
        const t = state.track_window && state.track_window.current_track;
        if (t){
          const artists = (t.artists || []).map(a => a.name).join(", ");
          nowPlaying.textContent = t.name + (artists ? " — " + artists : "");
        }
      });

      const ok = await player.connect();
      if (!ok) setStatus("Could not connect Spotify player.");
    }

    async function apiFetch(url, options = {}){
      const token = await getValidToken();
      if (!token) throw new Error("Please log in first.");

      options.headers = Object.assign({}, options.headers || {}, {
        Authorization: "Bearer " + token
      });

      let r = await fetch(url, options);

      if (r.status === 401){
        await refreshAccessToken();
        const newToken = await getValidToken();
        options.headers.Authorization = "Bearer " + newToken;
        r = await fetch(url, options);
      }
      return r;
    }

    async function searchTracks(){
      const q = searchBox.value.trim();
      if (!q) return;

      try{
        setStatus("Searching…");
        resultsEl.innerHTML = "";

        const r = await apiFetch(
          "https://api.spotify.com/v1/search?type=track&limit=10&q=" + encodeURIComponent(q)
        );

        const data = await r.json();
        if (!r.ok) throw new Error(data.error?.message || "Search failed");

        const tracks = data.tracks?.items || [];
        if (!tracks.length){
          setStatus("No results.");
          return;
        }

        const frag = document.createDocumentFragment();

        tracks.forEach(track => {
          const b = document.createElement("button");
          b.className = "track";

          const title = document.createElement("span");
          title.className = "track-title";
          title.textContent = track.name;

          const artist = document.createElement("span");
          artist.className = "track-artist";
          artist.textContent = (track.artists || []).map(a => a.name).join(", ");

          b.append(title, artist);
          b.addEventListener("click", () => playTrack(track.uri, track.name, artist.textContent));
          frag.appendChild(b);
        });

        resultsEl.appendChild(frag);
        setStatus("Tap a song to play it.");
      }catch(err){
        setStatus("Search error: " + err.message);
      }
    }

    async function playTrack(uri, name, artist){
      try{
        if (!player || !deviceId) throw new Error("Player is not ready yet.");

        if (!audioUnlocked) {
          throw new Error("Tap Enable Audio once before selecting a song.");
        }

        setStatus("Starting " + name + "…");

        // Make our browser player the active Spotify device.
        const transfer = await apiFetch("https://api.spotify.com/v1/me/player", {
          method:"PUT",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({device_ids:[deviceId], play:false})
        });
        if (!transfer.ok && transfer.status !== 204){
          const d = await transfer.json().catch(() => ({}));
          throw new Error(d.error?.message || "Could not activate player");
        }

        // Pass exactly ONE track URI.
        const r = await apiFetch(
          "https://api.spotify.com/v1/me/player/play?device_id=" + encodeURIComponent(deviceId),
          {
            method:"PUT",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({uris:[uri]})
          }
        );

        if (!r.ok && r.status !== 204){
          const d = await r.json().catch(() => ({}));
          throw new Error(d.error?.message || "Playback failed");
        }

        nowPlaying.textContent = name + (artist ? " — " + artist : "");
        setStatus("Playing.");
      }catch(err){
        setStatus("Play error: " + err.message);
      }
    }

    enableAudioBtn.addEventListener("click", () => {
      try{
        if (!player) throw new Error("Player is not ready yet.");

        // IMPORTANT for mobile browsers: call activateElement directly
        // from the user's click event, before any async/network work.
        const activation = player.activateElement();

        Promise.resolve(activation).then(() => {
          audioUnlocked = true;
          enableAudioBtn.classList.add("hidden");
          setStatus("Audio enabled. Search and tap a song.");
        }).catch(err => {
          audioUnlocked = false;
          setStatus("Could not enable audio: " + err.message);
        });
      }catch(err){
        setStatus(err.message);
      }
    });

    loginBtn.addEventListener("click", beginLogin);
    logoutBtn.addEventListener("click", () => {
      clearAuth();
      setStatus("Logged out.");
    });
    searchBtn.addEventListener("click", searchTracks);
    searchBox.addEventListener("keydown", e => {
      if (e.key === "Enter") searchTracks();
    });

    playBtn.addEventListener("click", async () => {
      try{
        if (!player) throw new Error("Player is not ready.");
        if (!audioUnlocked) throw new Error("Tap Enable Audio first.");
        await player.togglePlay();
      }catch(err){ setStatus(err.message); }
    });

    prevBtn.addEventListener("click", async () => {
      try{
        if (!player) throw new Error("Player is not ready.");
        await player.previousTrack();
      }catch(err){ setStatus(err.message); }
    });

    nextBtn.addEventListener("click", async () => {
      try{
        if (!player) throw new Error("Player is not ready.");
        await player.nextTrack();
      }catch(err){ setStatus(err.message); }
    });

    (async function boot(){
      try{
        const params = new URLSearchParams(location.search);
        const error = params.get("error");
        const code = params.get("code");
        const state = params.get("state");

        if (error) throw new Error("Spotify login: " + error);

        if (code){
          const expected = localStorage.getItem("oauth_state");
          if (expected && state !== expected) throw new Error("Login state check failed.");
          setStatus("Finishing login…");
          await exchangeCode(code);
        }

        const token = await getValidToken();
        updateAuthUI(!!token);

        if (token){
          setStatus("Logged in. Connecting player…");
          startPlayerIfPossible();
        }
      }catch(err){
        setStatus(err.message);
        updateAuthUI(false);
      }
    })();
  </script>
</body>
</html>
